[package]
name = "cinerama"
version = "0.1.0"
description = "Small tool to toggle a screen black"
authors = ["Hugo Attal"]
license = ""
repository = ""
default-run = "cinerama"
edition = "2024"
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
